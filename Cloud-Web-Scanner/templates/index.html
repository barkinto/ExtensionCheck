<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>CRXPlorer - Web Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0d13; --s: #13161f; --s2: #1c2030; --bd: #2a2f45; --a: #7c6cf0; --a2: #a59bfe; --t: #eae8f4; --t2: #8e8ba8; --g: #2ecc71; --r: #e74c3c; --o: #f39c12; --y: #f1c40f;}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--t); padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 2rem; background: linear-gradient(135deg, var(--a2), var(--a)); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 20px;}
        .card { background: var(--s); border: 1px solid var(--bd); border-radius: 12px; padding: 30px; text-align: center; }
        textarea { width: 100%; height: 150px; background: var(--s2); color: var(--t); border: 1px solid var(--bd); border-radius: 8px; padding: 15px; font-family: monospace; resize: vertical; margin-bottom: 15px;}
        button { background: var(--a); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #685ac9; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; display: none; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--bd); }
        th { background: var(--s2); color: var(--a2); }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        .bg-g { background: rgba(46,204,113,0.15); color: var(--g); }
        .bg-y { background: rgba(241,196,15,0.15); color: var(--y); }
        .bg-o { background: rgba(243,156,18,0.15); color: var(--o); }
        .bg-r { background: rgba(231,76,60,0.15); color: var(--r); }
        #loading { display: none; color: var(--a2); margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🛡️ Extension Web Scanner</h1>
    <div class="card" id="inputCard">
        <p style="color: var(--t2); margin-bottom: 15px;">Taranacak Extension ID'lerini alt alta yapistirin:</p>
        <textarea id="ids" placeholder="fheoggkfdfchfphceeifdbepaooicaho&#10;odfafepnkmbhccpbejgmiehpchacaeak"></textarea>
        <br>
        <button onclick="startScan()">🚀 PowerShell Ile Tarama Baslat</button>
        <div id="loading">Arka planda (PS) taraniyor, lutfen bekleyin... (Bu islem 15-30 sn surebilir)</div>
    </div>

    <table id="resTable">
        <thead><tr><th>#</th><th>Eklenti Adi</th><th>ID</th><th>Skor</th><th>Risk</th><th>Izinler</th><th>Oneri</th><th>CRX URL</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        async function startScan() {
            const rawIds = document.getElementById('ids').value;
            if(!rawIds.trim()) return alert("Lutfen ID girin");
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resTable').style.display = 'none';

            try {
                const req = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: rawIds.split('\n') })
                });
                
                const data = await req.json();
                
                const tbody = document.getElementById('tbody');
                tbody.innerHTML = '';
                
                data.sort((a,b) => a.CRXScore - b.CRXScore);
                
                data.forEach((r, i) => {
                    let bc = 'bg-g';
                    if(r.CRXScore <= 40) bc = 'bg-r';
                    else if(r.CRXScore <= 60) bc = 'bg-o';
                    else if(r.CRXScore <= 80) bc = 'bg-y';

                    let rc = 'WHITELIST'; let rbc = 'bg-g';
                    if(r.Recommendation === 'ENGELLE') { rc = 'ENGELLE'; rbc = 'bg-r'; }
                    else if(r.Recommendation === 'DIKKAT') { rc = 'DIKKAT'; rbc = 'bg-o'; }
                    else if(r.Recommendation === 'DEGERLENDIR') { rc = 'DEGERLENDIR'; rbc = 'bg-y'; }

                    tbody.innerHTML += `
                        <tr>
                            <td>${i+1}</td>
                            <td><strong>${r.Name}</strong></td>
                            <td style="font-size:0.8rem; color:#8e8ba8">${r.ID}</td>
                            <td><span class="badge ${bc}">${r.CRXScore}/100</span></td>
                            <td>${r.CRXLevel}</td>
                            <td>${r.Permissions}</td>
                            <td><span class="badge ${rbc}">${rc}</span></td>
                            <td><a href="https://crxplorer.com/extension/${r.ID}" target="_blank" style="color:var(--a2); text-decoration:none; font-weight:bold;">Link ↗</a></td>
                        </tr>
                    `;
                });
                document.getElementById('resTable').style.display = 'table';
            } catch(e) {
                alert("Hata olustu: " + e.message);
            }
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
